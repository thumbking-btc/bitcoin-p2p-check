<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">iPhone에서 비트코인 P2P 계산기를 홈 화면에 추가하는 방법</title>
  <desc id="desc">Safari의 더 보기 또는 공유 버튼, 홈 화면에 추가, 웹 앱으로 열기와 추가 버튼을 차례대로 안내합니다.</desc>
  <style>
    text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #111820; }
    .panel { fill: #fffdf8; stroke: #c8c0b3; stroke-width: 3; }
    .screen { fill: #f4f5f6; stroke: #111820; stroke-width: 4; }
    .ui { font-size: 30px; font-weight: 700; }
    .small { font-size: 24px; fill: #65707a; }
    .label { font-size: 32px; font-weight: 800; }
    .redbox { fill: none; stroke: #d92d20; stroke-width: 8; }
    .red { fill: #d92d20; }
    .white { fill: #fff; }
    .accent { fill: #a94d00; }
    .blue { fill: #2166d1; }
    .gold { fill: #ffc46f; }
    .light { fill: #d9d1c1; }
  </style>
  <rect width="1080" height="1920" fill="#f1eee6"/>

  <g transform="translate(66 58)">
    <rect width="112" height="112" rx="28" fill="#111820"/>
    <circle cx="56" cy="56" r="40" fill="#f7931a"/>
    <text class="white" x="56" y="60" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="56" font-weight="700" transform="rotate(13.88 56 56)">₿</text>
  </g>
  <text class="accent" x="210" y="101" font-size="34" font-weight="750">iPhone · Safari</text>
  <text x="210" y="163" font-size="62" font-weight="850" letter-spacing="-3">홈 화면에 추가하기</text>
  <text x="68" y="224" font-size="27" fill="#65707a">빨간 표시를 순서대로 누르면 앱처럼 홈 화면에서 열 수 있습니다.</text>

  <rect class="panel" x="52" y="268" width="976" height="342" rx="30"/>
  <g transform="translate(78 290)">
    <rect class="screen" width="566" height="296" rx="30"/>
    <rect x="22" y="24" width="522" height="205" rx="18" fill="#fff"/>
    <circle cx="58" cy="61" r="23" fill="#f7931a"/>
    <text class="white" x="58" y="64" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" transform="rotate(13.88 58 61)">₿</text>
    <text x="94" y="70" class="ui" font-size="24">비트코인 P2P 계산기</text>
    <rect x="42" y="96" width="482" height="42" rx="7" fill="#111820"/>
    <rect x="42" y="151" width="225" height="52" rx="7" fill="#e8e3d8"/>
    <rect x="280" y="151" width="244" height="52" rx="7" fill="#e8e3d8"/>
    <rect x="20" y="241" width="526" height="40" rx="20" fill="#e4e7eb"/>
    <text x="282" y="268" text-anchor="middle" font-size="20" fill="#65707a">bitcoin-p2p-check.thumbking.workers.dev</text>
    <rect class="redbox" x="458" y="232" width="70" height="58" rx="16"/>
    <text x="493" y="270" text-anchor="middle" font-size="38" font-weight="900">···</text>
  </g>
  <circle class="red" cx="714" cy="333" r="34"/><text class="white" x="714" y="345" text-anchor="middle" font-size="35" font-weight="900">1</text>
  <text x="765" y="328" class="label">Safari에서 열기</text>
  <text x="690" y="389" class="ui">아래쪽 <tspan fill="#d92d20">···</tspan>를 누른 뒤</text>
  <text x="690" y="437" class="ui"><tspan font-weight="850">공유</tspan>를 누릅니다.</text>
  <text x="690" y="493" class="small">공유 아이콘이 바로</text>
  <text x="690" y="529" class="small">보이면 그것을 누르세요.</text>

  <rect class="panel" x="52" y="638" width="976" height="342" rx="30"/>
  <g transform="translate(78 660)">
    <rect class="screen" width="566" height="296" rx="30"/>
    <rect x="24" y="20" width="518" height="256" rx="24" fill="#fff"/>
    <rect x="236" y="34" width="94" height="7" rx="4" fill="#c8c0b3"/>
    <text x="48" y="91" class="ui">Safari 메뉴</text>
    <line x1="44" x2="522" y1="112" y2="112" stroke="#e8e3d8" stroke-width="3"/>
    <rect x="58" y="139" width="42" height="35" rx="7" fill="none" stroke="#2166d1" stroke-width="4"/>
    <path d="M79 158v-31M67 139l12-12 12 12" fill="none" stroke="#2166d1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="166" class="ui">공유</text>
    <rect class="redbox" x="44" y="122" width="478" height="70" rx="14"/>
    <text x="68" y="235" class="small">책갈피 추가</text>
  </g>
  <circle class="red" cx="714" cy="703" r="34"/><text class="white" x="714" y="715" text-anchor="middle" font-size="35" font-weight="900">2</text>
  <text x="765" y="713" class="label">공유 누르기</text>
  <text x="690" y="782" class="ui">메뉴에서 <tspan font-weight="850">공유</tspan>를</text>
  <text x="690" y="830" class="ui">선택합니다.</text>
  <text x="690" y="892" class="small">공유 버튼을 바로 눌렀다면</text>
  <text x="690" y="928" class="small">이 단계는 건너뜁니다.</text>

  <rect class="panel" x="52" y="1008" width="976" height="342" rx="30"/>
  <g transform="translate(78 1030)">
    <rect class="screen" width="566" height="296" rx="30"/>
    <rect x="24" y="20" width="518" height="256" rx="24" fill="#fff"/>
    <rect x="236" y="34" width="94" height="7" rx="4" fill="#c8c0b3"/>
    <text x="48" y="89" class="ui">공유 메뉴</text>
    <line x1="44" x2="522" y1="112" y2="112" stroke="#e8e3d8" stroke-width="3"/>
    <rect x="61" y="133" width="42" height="42" rx="9" fill="#e8e3d8" stroke="#65707a" stroke-width="3"/>
    <path d="M70 155h24M82 143v24" stroke="#111820" stroke-width="4" stroke-linecap="round"/>
    <text x="128" y="166" class="ui">홈 화면에 추가</text>
    <rect class="redbox" x="44" y="122" width="478" height="72" rx="14"/>
    <text x="68" y="237" class="small">읽기 목록에 추가</text>
  </g>
  <circle class="red" cx="714" cy="1073" r="34"/><text class="white" x="714" y="1085" text-anchor="middle" font-size="35" font-weight="900">3</text>
  <text x="765" y="1083" class="label">홈 화면에 추가</text>
  <text x="690" y="1150" class="ui">목록을 내려</text>
  <text x="690" y="1198" class="ui"><tspan font-weight="850">홈 화면에 추가</tspan>를</text>
  <text x="690" y="1246" class="ui">누릅니다.</text>
  <text x="690" y="1300" class="small">안 보이면 맨 아래</text>
  <text x="690" y="1336" class="small">‘동작 편집’에서 추가하세요.</text>

  <rect class="panel" x="52" y="1378" width="976" height="342" rx="30"/>
  <g transform="translate(78 1400)">
    <rect class="screen" width="566" height="296" rx="30"/>
    <rect x="24" y="20" width="518" height="256" rx="24" fill="#fff"/>
    <text x="48" y="72" class="ui" font-weight="850">홈 화면에 추가</text>
    <text class="blue" x="470" y="72" font-size="28" font-weight="850">추가</text>
    <line x1="44" x2="522" y1="96" y2="96" stroke="#e8e3d8" stroke-width="3"/>
    <text x="48" y="143" class="small">웹 앱으로 열기</text>
    <rect x="430" y="115" width="74" height="42" rx="21" fill="#32c759"/>
    <circle cx="482" cy="136" r="17" fill="#fff"/>
    <rect class="redbox" x="38" y="105" width="476" height="64" rx="14"/>
    <rect class="redbox" x="438" y="32" width="84" height="56" rx="14"/>
    <rect x="48" y="194" width="58" height="58" rx="14" fill="#111820"/>
    <circle cx="77" cy="223" r="21" fill="#f7931a"/>
    <text class="white" x="77" y="226" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" transform="rotate(13.88 77 223)">₿</text>
    <text x="126" y="231" font-size="25" font-weight="750">P2P 계산기</text>
  </g>
  <circle class="red" cx="714" cy="1443" r="34"/><text class="white" x="714" y="1455" text-anchor="middle" font-size="35" font-weight="900">4</text>
  <text x="765" y="1453" class="label">마지막으로 추가</text>
  <text x="690" y="1521" class="ui"><tspan font-weight="850">웹 앱으로 열기</tspan>를 켜고</text>
  <text x="690" y="1569" class="ui">오른쪽 위 <tspan font-weight="850">추가</tspan>를</text>
  <text x="690" y="1617" class="ui">누릅니다.</text>
  <text x="690" y="1674" class="small">이제 홈 화면의 아이콘으로</text>
  <text x="690" y="1710" class="small">바로 실행할 수 있습니다.</text>

  <rect x="52" y="1762" width="976" height="112" rx="24" fill="#111820"/>
  <text class="gold" x="540" y="1810" text-anchor="middle" font-size="26" font-weight="800">비트코인 P2P 계산기</text>
  <text class="light" x="540" y="1850" text-anchor="middle" font-size="22">실시간 시세 확인에는 인터넷 연결이 필요합니다.</text>
</svg>
