name: Apply P2P feature patch

on:
  pull_request:
    branches: [feature/receive-info-current-main-final]
    paths: [docs/.feature-patch-trigger.txt]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/receive-info-current-main-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch feature branch
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/components/P2PTradeTool.tsx')
          s = p.read_text()
          state_anchor = '  const [isSharing, setIsSharing] = useState(false);\n'
          if 'includePriceDetails' not in s:
              s = s.replace(state_anchor, state_anchor + '  const [includePriceDetails, setIncludePriceDetails] = useState(false);\n  const [receiveShareText, setReceiveShareText] = useState("");\n', 1)
          elif 'receiveShareText' not in s:
              s = s.replace('  const [includePriceDetails, setIncludePriceDetails] = useState(false);\n', '  const [includePriceDetails, setIncludePriceDetails] = useState(false);\n  const [receiveShareText, setReceiveShareText] = useState("");\n', 1)

          draft_anchor = '''  useEffect(() => {
    if (!draftHydrated) return;
'''
          if 'handleReceiveShareText' not in s:
              receive_effect = '''  useEffect(() => {
    const handleReceiveShareText = (event: Event) => {
      if (!(event instanceof CustomEvent)) return;
      setReceiveShareText(typeof event.detail === "string" ? event.detail : "");
    };
    window.addEventListener("p2p-receive-share-text", handleReceiveShareText);
    return () => window.removeEventListener("p2p-receive-share-text", handleReceiveShareText);
  }, []);

'''
              if draft_anchor not in s: raise SystemExit('draft anchor missing')
              s = s.replace(draft_anchor, receive_effect + draft_anchor, 1)

          intent = '''  const tradeIntent = quote ? buildTradeIntent({
    tradeRole,
    amountBasis,
    paymentKrw: quote.paymentKrw,
    sats: quote.sats,
    bitcoinDisplayUnit,
  }) : "";
'''
          if 'const premiumShareLabel' not in s:
              if intent not in s: raise SystemExit('intent anchor missing')
              s = s.replace(intent, intent + '''  const premiumShareLabel = premiumPercent === null
    ? ""
    : `P ${premiumPercent > 0 ? "+" : ""}${premiumPercent.toLocaleString("ko-KR", { maximumFractionDigits: 2 })}%`;
  const compactTradeIntent = tradeIntent && premiumShareLabel ? `${tradeIntent} · ${premiumShareLabel}` : tradeIntent;
''', 1)

          old_share = '''  const shareText = quote && multiplier !== null && tradeIntent ? [
    tradeIntent,
    `계산 시각: ${formatTime(referenceTime)}`,
    `구매자 → 판매자: ${formatKrw(quote.paymentKrw)}`,
    `판매자 → 구매자: ${formatTradeBitcoinAmount({ sats: quote.sats, bitcoinDisplayUnit })}`,
    `구매자 자금 출처: ${fundingSource} (구매자 제공 정보 · 거래 전 상호 확인)`,
    "",
    "[가격 계산]",
    `금액 기준: ${amountBasis === "krw" ? "원화 금액" : "비트코인 수량"}`,
    `기준: ${referenceLabel} ${formatKrw(referencePrice)} / BTC`,
    `판매자 프리미엄: ${premiumPercent}%`,
    `판매자가 파는 BTC 가격: ${formatKrw(quote.appliedPrice)} / BTC`,
    `참고 업비트 프리미엄: ${formatPercent(effectiveKoreaPremium)}`,
    "온체인 수수료: 판매자 부담 · 구매자 수령량 차감 없음",
    "확인용: 원화 입금·BTC 수령 증빙 아님",
  ].join("\\n") : "";
'''
          new_share = '''  const shareText = quote && multiplier !== null && compactTradeIntent ? [
    compactTradeIntent,
    `계산 시각: ${formatTime(referenceTime)}`,
    `구매자 → 판매자: ${formatKrw(quote.paymentKrw)}`,
    `판매자 → 구매자: ${formatTradeBitcoinAmount({ sats: quote.sats, bitcoinDisplayUnit })}`,
    `구매자 자금 출처: ${fundingSource} (구매자 제공 정보 · 거래 전 상호 확인)`,
    ...(includePriceDetails ? [
      "",
      "[가격 계산]",
      `금액 기준: ${amountBasis === "krw" ? "원화 금액" : "비트코인 수량"}`,
      `기준: ${referenceLabel} ${formatKrw(referencePrice)} / BTC`,
      `판매자 프리미엄: ${premiumPercent}%`,
      `판매자가 파는 BTC 가격: ${formatKrw(quote.appliedPrice)} / BTC`,
      `참고 업비트 프리미엄: ${formatPercent(effectiveKoreaPremium)}`,
      "온체인 수수료: 판매자 부담 · 구매자 수령량 차감 없음",
      "확인용: 원화 입금·BTC 수령 증빙 아님",
    ] : []),
  ].join("\\n") : "";
'''
          if old_share in s:
              s = s.replace(old_share, new_share, 1)
          elif 'compactTradeIntent ? [' not in s:
              raise SystemExit('share copy anchor missing')

          old_link = '''  const shareTextWithLink = shareText && tradeLink
    ? `${shareText}\\n\\n거래 조건 검증하기: ${tradeLink}`
    : shareText;
'''
          new_link = '''  const shareTextWithReceive = shareText && receiveShareText
    ? `${shareText}\\n\\n[BTC 받을 정보]\\n${receiveShareText}`
    : shareText;
  const shareTextWithLink = shareTextWithReceive && tradeLink
    ? `${shareTextWithReceive}\\n\\n거래 조건 검증하기: ${tradeLink}`
    : shareTextWithReceive;
'''
          if old_link in s:
              s = s.replace(old_link, new_link, 1)
          elif 'shareTextWithReceive' not in s:
              raise SystemExit('share link anchor missing')

          preview = '''          <pre aria-label="거래 조건 이미지와 함께 공유되는 문구">
            {draftHydrated && shareTextWithLink
              ? shareTextWithLink
              : "거래 조건을 계산하면 공유 문구가 표시됩니다."}
          </pre>
'''
          if 'className="share-detail-option"' not in s:
              option = '''          <label className="share-detail-option">
            <input type="checkbox" checked={includePriceDetails} onChange={(event) => setIncludePriceDetails(event.target.checked)} />
            <span><strong>상세 계산정보 포함</strong><small>선택 사항 · 가격 계산 근거까지 함께 보냅니다.</small></span>
          </label>
'''
              if preview not in s: raise SystemExit('preview anchor missing')
              s = s.replace(preview, preview + option, 1)
          p.write_text(s)

          css = Path('app/globals.css')
          c = css.read_text()
          if '.share-detail-option {' not in c:
              c += '''

.share-detail-option { display:flex; align-items:center; gap:10px; margin:0; padding:10px 12px; border-top:1px solid var(--line); background:#f7f3ea; cursor:pointer; }
.share-detail-option:hover { background:#eee8dc; }
.share-detail-option input { width:18px; height:18px; margin:0; flex:0 0 auto; accent-color:var(--orange); }
.share-detail-option > span { display:grid; gap:2px; min-width:0; }
.share-detail-option strong { color:var(--ink); font-size:12px; font-weight:800; }
.share-detail-option small { color:var(--muted); font-size:10px; line-height:1.35; }
'''
          css.write_text(c)

          rp = Path('app/components/TradeReceiveInfoPortal.tsx')
          r = rp.read_text()
          old_qr = '''async function qrFile(canvas: HTMLCanvasElement, name: string): Promise<File> {
  const blob = await new Promise<Blob>((resolve, reject) => {
    canvas.toBlob((value) => value ? resolve(value) : reject(new Error("QR 생성 실패")), "image/png");
  });
  return new File([blob], name, { type: "image/png", lastModified: Date.now() });
}
'''
          new_qr = '''async function qrShareFile(canvas: HTMLCanvasElement, name: string, result: Result, amountSats: number): Promise<File> {
  const card = document.createElement("canvas");
  card.width = 1200;
  card.height = 900;
  const context = card.getContext("2d");
  if (!context) throw new Error("QR 공유 이미지를 만들지 못했습니다.");
  context.fillStyle = "#f5f0e3";
  context.fillRect(0, 0, 1200, 900);
  context.strokeStyle = "#101619";
  context.lineWidth = 4;
  context.strokeRect(30, 30, 1140, 840);
  context.fillStyle = "#101619";
  context.textAlign = "left";
  context.textBaseline = "middle";
  context.font = '800 48px "Pretendard Variable", Pretendard, sans-serif';
  context.fillText("BTC 수취정보", 72, 92);
  context.fillStyle = "#a94d00";
  context.font = '750 23px "Pretendard Variable", Pretendard, sans-serif';
  context.fillText(result.kind === "onchain" ? "온체인" : "라이트닝 인보이스", 72, 142);
  const maxQr = 560;
  const scale = Math.min(maxQr / canvas.width, maxQr / canvas.height, 1);
  const qrW = Math.round(canvas.width * scale);
  const qrH = Math.round(canvas.height * scale);
  const x = Math.round((1200 - qrW) / 2);
  const y = 185;
  context.fillStyle = "#fff";
  context.fillRect(x - 20, y - 20, qrW + 40, qrH + 40);
  context.imageSmoothingEnabled = false;
  context.drawImage(canvas, x, y, qrW, qrH);
  context.fillStyle = "#101619";
  context.textAlign = "center";
  context.font = '800 34px "SFMono-Regular", Consolas, monospace';
  context.fillText(formatSats(amountSats), 600, 825);
  const blob = await new Promise<Blob>((resolve, reject) => card.toBlob((value) => value ? resolve(value) : reject(new Error("QR 공유 이미지 생성 실패")), "image/png"));
  card.width = 1;
  card.height = 1;
  return new File([blob], name, { type: "image/png", lastModified: Date.now() });
}
'''
          if old_qr in r:
              r = r.replace(old_qr, new_qr, 1)
          elif 'async function qrShareFile' not in r:
              raise SystemExit('qr file anchor missing')

          rem = '''  const remainingSeconds = useMemo(() => {
    if (!result?.expiresAt) return null;
    return Math.max(0, result.expiresAt - nowSeconds);
  }, [nowSeconds, result?.expiresAt]);
'''
          if 'const receiveShareText = useMemo' not in r:
              extra = '''  const receiveShareText = useMemo(() => {
    if (!expectedSats) return "";
    if (result) {
      if (result.kind === "onchain") {
        return [`온체인 주소: ${onchain.trim()}`, `금액 지정 요청(BIP21): ${result.payload}`].join("\\n");
      }
      return [`BOLT11: ${result.payload}`, result.expiresAt ? `인보이스 만료: ${formatExpiry(result.expiresAt)}` : ""].filter(Boolean).join("\\n");
    }
    if (rail === "onchain") {
      if (!onchain.trim()) return "";
      try { return `온체인 주소: ${createOnchainRequest(onchain.trim(), BigInt(expectedSats)).address}`; } catch { return ""; }
    }
    if (lightningMode !== "address" || !lightningSource.trim()) return "";
    const source = lightningSource.trim();
    return `${lightningAddressLike(source) ? "라이트닝 주소" : "LNURL-pay"}: ${source}`;
  }, [expectedSats, lightningMode, lightningSource, onchain, rail, result]);

  useEffect(() => {
    window.dispatchEvent(new CustomEvent("p2p-receive-share-text", { detail: receiveShareText }));
  }, [receiveShareText]);

  useEffect(() => () => {
    window.dispatchEvent(new CustomEvent("p2p-receive-share-text", { detail: "" }));
  }, []);
'''
              if rem not in r: raise SystemExit('remaining anchor missing')
              r = r.replace(rem, rem + extra, 1)

          start = r.find('  async function shareAddressOnly() {')
          if start != -1:
              end = r.find('  async function share() {', start)
              if end == -1: raise SystemExit('share function missing')
              r = r[:start] + r[end:]
          r = r.replace('        {rail === "onchain" || lightningMode === "address" ? (\n          <button className={styles.secondary} type="button" disabled={busy || !rawAddressShareText} onClick={() => void shareAddressOnly()}>주소 공유</button>\n        ) : null}\n', '')
          r = r.replace('        style={{ gridTemplateColumns: rail === "onchain" || lightningMode === "address" ? "minmax(0, 1fr) auto auto" : undefined }}\n', '')

          old_file = '''      const file = await qrFile(
        canvasRef.current,
        result.kind === "onchain" ? "onchain-qr.png" : "lightning-invoice-qr.png",
      );
'''
          new_file = '''      const file = await qrShareFile(
        canvasRef.current,
        result.kind === "onchain" ? "onchain-qr.png" : "lightning-invoice-qr.png",
        result,
        expectedSats,
      );
'''
          if old_file in r:
              r = r.replace(old_file, new_file, 1)
          rp.write_text(r)
      - name: Verify
        run: npm ci && npm run verify
      - name: Commit feature patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/components/P2PTradeTool.tsx app/components/TradeReceiveInfoPortal.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "Integrate receive info into trade sharing"
          git push origin HEAD:feature/receive-info-current-main-final
