name: Prepare v2.0.7

on:
  push:
    branches: [release/v2.0.7]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: release/v2.0.7

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Check whether release is already prepared
        id: release
        shell: bash
        run: |
          if [ "$(node -p "require('./package.json').version")" = "2.0.7" ] \
            && grep -q 'APP_VERSION = "2.0.7"' app/lib/app-version.ts \
            && grep -q '^## v2.0.7 ' CHANGELOG.md; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version files and changelog
        if: steps.release.outputs.needs_update == 'true'
        run: |
          npm version 2.0.7 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path

          app_version = Path('app/lib/app-version.ts')
          app_version.write_text('export const APP_VERSION = "2.0.7";\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## v2.0.6 — 빌드 의존성 정리\n'
          entry = '''## v2.0.7 — 유지보수·검증 최적화\n\n- 설치 안내의 iPhone·Android 이미지를 지연 로딩하고 비동기 디코딩하도록 변경했습니다.\n- 실시간 가격 연결 상태에 따른 시장 갱신 간격 계산을 공용 함수로 통합하고, 운영 코드와 테스트가 같은 로직을 검증하도록 정리했습니다.\n- 거래 모집글 미리보기의 불필요한 상태 초기화 렌더를 줄이고, 직접 편집한 문구 보존과 자동 갱신 로직을 공용 함수로 연결했습니다.\n- 앱 버전 테스트의 고정 버전 문자열을 제거하고 `APP_VERSION`과 `package.json` 버전이 일치하는지 검증하도록 변경했습니다.\n- `verify` 명령으로 린트·프로덕션 빌드·빌드 결과 테스트를 한 번에 수행하고, 수동 배포도 검증 성공 후에만 실행하도록 정리했습니다.\n- Pull Request와 `main` 변경을 검사하는 GitHub Actions 검증을 추가하고, Tailwind 제거 후 남아 있던 잠금 파일을 현재 의존성 기준으로 정리했습니다.\n\n'''
          if '## v2.0.7 ' not in text:
              if marker not in text:
                  raise SystemExit('v2.0.6 changelog marker not found')
              text = text.replace(marker, entry + marker, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

      - name: Install locked dependencies
        if: steps.release.outputs.needs_update == 'true'
        run: npm ci

      - name: Verify release
        if: steps.release.outputs.needs_update == 'true'
        run: npm run verify

      - name: Audit production dependencies
        if: steps.release.outputs.needs_update == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Commit prepared release
        if: steps.release.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/lib/app-version.ts CHANGELOG.md
          git commit -m "Release v2.0.7"
          git push origin HEAD:release/v2.0.7
