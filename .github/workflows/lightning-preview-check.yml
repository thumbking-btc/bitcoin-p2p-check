name: Lightning preview check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'feature/lightning-address-preview' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static app
        run: npm run build

      - name: Verify Lightning preview was exported
        run: grep -R -q "라이트닝 결제 요청 만들기" dist/client

      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
