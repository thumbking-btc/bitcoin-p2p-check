name: Trade receive-info preview check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'feature/trade-receive-info-flow' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static app
        run: npm run build

      - name: Verify receive-info flow was exported
        run: |
          grep -R -q "BTC 받을 정보" dist/client
          grep -R -q "선택 사항" dist/client
          grep -R -q "금액 고정 인보이스 만들기" dist/client
          grep -R -q "LNURL1" dist/client
          grep -R -q "인보이스 확인 및 QR 만들기" dist/client
          grep -R -q 'params.set("v","3")\|params.set("v", "3")' dist/client

      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

# Preview-only verification. Do not merge without mobile testing.
