name: Payment request preview check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'feature/lightning-address-preview' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static app
        run: npm run build

      - name: Verify payment request preview was exported
        run: |
          grep -R -q "BTC 받을 정보 만들기" dist/client
          grep -R -q "온체인 수취 주소" dist/client
          grep -R -q "라이트닝 주소" dist/client

      - name: Verify deployed preview API
        run: |
          node - <<'NODE'
          const response = await fetch('https://e9f5acd6-bitcoin-p2p-check.thumbking-btc.workers.dev/api/lightning-address', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({address: 'blankgrass886@walletofsatoshi.com', amountSats: 21}),
          });
          const text = await response.text();
          console.log('status', response.status);
          console.log(text.slice(0, 800));
          if (!response.ok) process.exit(1);
          const data = JSON.parse(text);
          if (!data.ok || typeof data.invoice !== 'string' || !data.invoice.toLowerCase().startsWith('lnbc')) process.exit(1);
          NODE

      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
