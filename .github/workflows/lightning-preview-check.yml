name: Lightning preview check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'feature/lightning-address-preview' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type-check Worker
        run: npx tsc --noEmit --module ESNext --moduleResolution Bundler --target ES2022 --lib ES2022,DOM,WebWorker worker/index.ts worker/lightning-address.ts worker/market.ts
