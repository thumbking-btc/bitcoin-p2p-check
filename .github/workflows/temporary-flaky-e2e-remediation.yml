name: Temporary Flaky E2E Remediation

on:
  push:
    branches:
      - review/ux-safety-20260903

permissions:
  contents: write

jobs:
  validate-and-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the review branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: review/ux-safety-20260903
          fetch-depth: 1

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.19.0
          cache: npm

      - name: Patch only the known flaky interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('e2e/hardening.spec.ts')
          text = path.read_text()
          old = '''  await page.getByText("상대 찾기·공유하기", { exact: true }).click();
          await page.getByRole("radio", { name: /거래 기록 카드/u }).check({ force: true });
          await page.locator(".managed-trade-records > summary").click();
          await expect(page.getByText("공개 기록", { exact: true })).toBeVisible();

          await page.clock.fastForward(61_000);
          '''
          new = '''  await page.getByText("상대 찾기·공유하기", { exact: true }).click();
          const tradeRecordCardMode = page.getByRole("radio", { name: /거래 기록 카드/u });
          await page.locator('label[for="output-mode-trade-image"]').click();
          await expect(tradeRecordCardMode).toBeChecked();
          const managedRecordsSummary = page.locator(".managed-trade-records > summary");
          await expect(managedRecordsSummary).toBeVisible();
          await managedRecordsSummary.click();
          await expect(page.getByText("공개 기록", { exact: true })).toBeVisible();

          await page.clock.fastForward(61_000);
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target block, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "e2e/hardening.spec.ts"

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Repeat the previously flaky test
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/hardening.spec.ts \
            --grep "a forward browser-clock jump across apparent expiry does not delete a capability" \
            --repeat-each=10 \
            --workers=1 \
            --retries=0

      - name: Commit only the validated test change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | tr -d '\r')" = "e2e/hardening.spec.ts"
          git add e2e/hardening.spec.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: make managed-record clock interaction deterministic'
          git push origin HEAD:review/ux-safety-20260903
