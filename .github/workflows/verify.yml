name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, build, and test
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lightning-e2e:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/receive-info-current-main-final'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Inspect Lightning Address discovery
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --max-time 20 \
            -H 'Accept: application/json' \
            'https://oksu.su/.well-known/lnurlp/thumbking' \
            -o /tmp/discovery.json
          cat /tmp/discovery.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/discovery.json","utf8")); if(j.tag!=="payRequest" || typeof j.callback!=="string") process.exit(1); console.log("DISCOVERY_OK", j.callback, j.minSendable, j.maxSendable)'

      - name: Request and validate fixed invoice through staging
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "attempt=$attempt"
            status=$(curl --silent --show-error --max-time 30 \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -X POST \
              --data '{"address":"thumbking@oksu.su","amountSats":1000}' \
              -o /tmp/lightning.json \
              -w '%{http_code}' \
              'https://staging-bitcoin-p2p-check.thumbking-btc.workers.dev/api/market?receive=lightning-address' || true)
            echo "HTTP=$status"
            cat /tmp/lightning.json || true
            echo
            if [ "$status" = "200" ]; then
              node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { validateBolt11Invoice } from "./app/lib/bolt11-invoice.mjs";
          const data = JSON.parse(fs.readFileSync("/tmp/lightning.json", "utf8"));
          if (data.ok !== true || data.amountSats !== 1000 || typeof data.invoice !== "string") process.exit(1);
          const checked = validateBolt11Invoice(data.invoice, { expectedSats: 1000n, minimumRemainingSeconds: 60 });
          console.log("BOLT11_VALID", checked.canonicalInvoice.slice(0, 40) + "...", checked.expiresAt);
          NODE
              exit 0
            fi
            sleep 20
          done
          exit 1
