name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, build, and test
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lightning-e2e:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/receive-info-current-main-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Lightning Address discovery
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --max-time 20 \
            -H 'Accept: application/json' \
            'https://oksu.su/.well-known/lnurlp/thumbking' \
            -o /tmp/discovery.json
          cat /tmp/discovery.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/discovery.json","utf8")); if(j.tag!=="payRequest" || typeof j.callback!=="string") process.exit(1); console.log("DISCOVERY_OK", j.callback, j.minSendable, j.maxSendable)'

      - name: Request fixed invoice through exact deployed commit
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -X POST \
            --data '{"address":"thumbking@oksu.su","amountSats":1000}' \
            -o /tmp/lightning.json \
            -w '%{http_code}' \
            'https://c5f4632d-bitcoin-p2p-check.thumbking-btc.workers.dev/api/market?receive=lightning-address' || true)
          echo "HTTP=$status"
          cat /tmp/lightning.json || true
          echo
          test "$status" = "200"
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/lightning.json","utf8")); if(j.ok!==true || j.amountSats!==1000 || typeof j.invoice!=="string" || !j.invoice.toLowerCase().startsWith("lnbc")) process.exit(1); console.log("COMMIT_INVOICE_OK", j.invoice.slice(0,36)+"...")'
