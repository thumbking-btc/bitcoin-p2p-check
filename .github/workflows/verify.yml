name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the verified artifact to production
        required: true
        type: boolean
        default: false
      deploy_staging:
        description: Deploy the verified staging revision to the isolated staging Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the verified browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run the complete release gate
        run: npm run verify:ci

      - name: Generate dependency and notice evidence
        shell: bash
        run: |
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          npm query "*" --json > npm-inventory.json
          sha256sum sbom.cdx.json npm-inventory.json THIRD_PARTY_NOTICES.md .wrangler/dry-run/production/index.js .wrangler/dry-run/production/index.js.map > release-evidence.SHA256SUMS

      - name: Preserve dependency and notice evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            sbom.cdx.json
            npm-inventory.json
            THIRD_PARTY_NOTICES.md
            release-evidence.SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Preserve the exact verified static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-dist-${{ github.sha }}
          path: dist/client
          if-no-files-found: error
          retention-days: 3

      - name: Preserve the exact verified Worker bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-worker-${{ github.sha }}
          path: |
            .wrangler/dry-run/production/index.js
            .wrangler/dry-run/production/index.js.map
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Preserve the exact verified staging Worker bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-staging-worker-${{ github.sha }}
          path: |
            .wrangler/dry-run/staging/index.js
            .wrangler/dry-run/staging/index.js.map
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  attest-production:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Restore the exact verified static artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-dist-${{ github.sha }}
          path: dist/client

      - name: Restore the exact verified Worker bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-worker-${{ github.sha }}
          path: .wrangler/dry-run/production

      - name: Restore the exact dependency evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-${{ github.sha }}
          path: .

      - name: Attest verified static and Worker artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/client/**
            .wrangler/dry-run/production/index.js
            .wrangler/dry-run/production/index.js.map

      - name: Bind the CycloneDX SBOM to the verified Worker bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .wrangler/dry-run/production/index.js
          sbom-path: sbom.cdx.json

  deploy-staging:
    needs: verify
    if: >-
      github.ref == 'refs/heads/staging' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    steps:
      - name: Check out the verified staging revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore the exact verified static artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-dist-${{ github.sha }}
          path: dist/client

      - name: Restore the exact verified staging Worker bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-staging-worker-${{ github.sha }}
          path: .verified-staging-worker

      - name: Refuse to supersede a newer staging revision
        shell: bash
        run: |
          git fetch --no-tags origin staging
          test "$(git rev-parse origin/staging)" = "${{ github.sha }}"

      - name: Capture the exact staging baseline before upload
        id: staging-baseline
        run: node scripts/check-staging-deployment.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify staging remote secret allowlist before upload
        run: |
          npm run secrets:check:staging
          node scripts/check-worker-version-secrets.mjs staging "${{ steps.staging-baseline.outputs.version_id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload the isolated staging candidate without promoting it
        id: staging-upload
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          git fetch --no-tags origin staging
          test "$(git rev-parse origin/staging)" = "${{ github.sha }}"
          node scripts/check-staging-deployment.mjs assert-single "${{ steps.staging-baseline.outputs.version_id }}" "${{ steps.staging-baseline.outputs.deployment_id }}"
          node scripts/check-worker-version-secrets.mjs staging "${{ steps.staging-baseline.outputs.version_id }}"
          npm run upload:staging:candidate -- --tag "${{ github.sha }}" --message "GitHub Actions ${{ github.run_id }} · staging v${APP_VERSION} · ${{ github.sha }}"
          EXPECTED_WORKER_NAME="bitcoin-p2p-check-staging" node scripts/record-staging-upload.mjs "$WRANGLER_OUTPUT_FILE_PATH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DEPLOY_APPROVED: "true"
          WRANGLER_OUTPUT_FILE_PATH: .wrangler/staging-version-upload.jsonl

      - name: Verify the exact staging candidate configuration
        run: |
          node scripts/check-worker-version-secrets.mjs staging "${{ steps.staging-upload.outputs.version_id }}"
          node scripts/check-staging-version.mjs "${{ steps.staging-upload.outputs.version_id }}" "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Recheck the exact staging candidate before Preview smoke
        run: node scripts/check-staging-version.mjs "${{ steps.staging-upload.outputs.version_id }}" "${{ github.sha }}" --require-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the exact staging candidate Preview before promotion
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_APP_VERSION="$APP_VERSION" EXPECTED_DEPLOYMENT_ENV="staging" EXPECTED_WORKER_TAG="${{ github.sha }}" EXPECTED_WORKER_VERSION_ID="${{ steps.staging-upload.outputs.version_id }}" node scripts/smoke-deployment.mjs --version-preview "${{ steps.staging-upload.outputs.preview_url }}"

      - name: Recheck the exact staging candidate after Preview smoke
        run: node scripts/check-staging-version.mjs "${{ steps.staging-upload.outputs.version_id }}" "${{ github.sha }}" --require-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Promote only the verified staging version
        shell: bash
        run: |
          node scripts/check-staging-version.mjs "${{ steps.staging-upload.outputs.version_id }}" "${{ github.sha }}"
          git fetch --no-tags origin staging
          test "$(git rev-parse origin/staging)" = "${{ github.sha }}"
          node scripts/check-staging-deployment.mjs assert-single "${{ steps.staging-baseline.outputs.version_id }}" "${{ steps.staging-baseline.outputs.deployment_id }}"
          npx wrangler versions deploy "${{ steps.staging-upload.outputs.version_id }}@100%" --yes --config wrangler.staging.jsonc --name bitcoin-p2p-check-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the exact staging deployment after promotion
        id: staging-promoted
        run: |
          node scripts/check-staging-deployment.mjs capture-exact "${{ steps.staging-upload.outputs.version_id }}"
          npm run secrets:check:staging
          node scripts/check-worker-version-secrets.mjs staging "${{ steps.staging-upload.outputs.version_id }}"
          node scripts/check-staging-version.mjs "${{ steps.staging-upload.outputs.version_id }}" "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify canonical staging without creating records
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_APP_VERSION="$APP_VERSION" EXPECTED_DEPLOYMENT_ENV="staging" EXPECTED_WORKER_TAG="${{ github.sha }}" EXPECTED_WORKER_VERSION_ID="${{ steps.staging-upload.outputs.version_id }}" node scripts/smoke-deployment.mjs https://bitcoin-p2p-check-staging.thumbking-btc.workers.dev

      - name: Detect a staging deployment or branch advance after smoke
        shell: bash
        run: |
          git fetch --no-tags origin staging
          test "$(git rev-parse origin/staging)" = "${{ github.sha }}"
          node scripts/check-staging-deployment.mjs assert-single "${{ steps.staging-upload.outputs.version_id }}" "${{ steps.staging-promoted.outputs.deployment_id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: [verify, attest-production]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Refuse production deployment until the Durable Object export bootstrap is approved
        shell: bash
        run: |
          echo "::error title=Production deployment blocked::The reviewed compatibility export bootstrap and an atomic production deployment path do not exist yet. Do not use versions upload or a gradual deployment with Durable Object exports."
          exit 1
