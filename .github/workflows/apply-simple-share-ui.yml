name: Apply simple share UI

on:
  push:
    branches: [feature/receive-info-current-main-final]
    paths: [.github/workflows/apply-simple-share-ui.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/receive-info-current-main-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused UI changes
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/components/P2PTradeTool.tsx')
          s = p.read_text()

          old = '  const [isSharing, setIsSharing] = useState(false);\n'
          new = old + '  const [includePriceDetails, setIncludePriceDetails] = useState(false);\n'
          if 'includePriceDetails' not in s:
              if old not in s: raise SystemExit('state anchor not found')
              s = s.replace(old, new, 1)

          old = '''  const shareText = quote && multiplier !== null && tradeIntent ? [
    tradeIntent,
    `계산 시각: ${formatTime(referenceTime)}`,
    `구매자 → 판매자: ${formatKrw(quote.paymentKrw)}`,
    `판매자 → 구매자: ${formatTradeBitcoinAmount({ sats: quote.sats, bitcoinDisplayUnit })}`,
    `구매자 자금 출처: ${fundingSource} (구매자 제공 정보 · 거래 전 상호 확인)`,
    "",
    "[가격 계산]",
    `금액 기준: ${amountBasis === "krw" ? "원화 금액" : "비트코인 수량"}`,
    `기준: ${referenceLabel} ${formatKrw(referencePrice)} / BTC`,
    `판매자 프리미엄: ${premiumPercent}%`,
    `판매자가 파는 BTC 가격: ${formatKrw(quote.appliedPrice)} / BTC`,
    `참고 업비트 프리미엄: ${formatPercent(effectiveKoreaPremium)}`,
    "온체인 수수료: 판매자 부담 · 구매자 수령량 차감 없음",
    "확인용: 원화 입금·BTC 수령 증빙 아님",
  ].join("\\n") : "";
'''
          new = '''  const shareText = quote && multiplier !== null && tradeIntent ? [
    tradeIntent,
    `계산 시각: ${formatTime(referenceTime)}`,
    `구매자 → 판매자: ${formatKrw(quote.paymentKrw)}`,
    `판매자 → 구매자: ${formatTradeBitcoinAmount({ sats: quote.sats, bitcoinDisplayUnit })}`,
    `구매자 자금 출처: ${fundingSource} (구매자 제공 정보 · 거래 전 상호 확인)`,
    ...(includePriceDetails ? [
      "",
      "[가격 계산]",
      `금액 기준: ${amountBasis === "krw" ? "원화 금액" : "비트코인 수량"}`,
      `기준: ${referenceLabel} ${formatKrw(referencePrice)} / BTC`,
      `판매자 프리미엄: ${premiumPercent}%`,
      `판매자가 파는 BTC 가격: ${formatKrw(quote.appliedPrice)} / BTC`,
      `참고 업비트 프리미엄: ${formatPercent(effectiveKoreaPremium)}`,
      "온체인 수수료: 판매자 부담 · 구매자 수령량 차감 없음",
      "확인용: 원화 입금·BTC 수령 증빙 아님",
    ] : []),
  ].join("\\n") : "";
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '...(includePriceDetails ? [' not in s:
              raise SystemExit('share text anchor not found')

          old = '''          <pre aria-label="거래 조건 이미지와 함께 공유되는 문구">
            {draftHydrated && shareTextWithLink
              ? shareTextWithLink
              : "거래 조건을 계산하면 공유 문구가 표시됩니다."}
          </pre>
'''
          new = old + '''          <label style={{ display: "flex", alignItems: "center", gap: "8px", margin: "12px 0 0", cursor: "pointer" }}>
            <input
              type="checkbox"
              checked={includePriceDetails}
              onChange={(event) => setIncludePriceDetails(event.target.checked)}
            />
            <span>상세 계산정보 포함 <small style={{ color: "var(--muted)" }}>(선택 사항)</small></span>
          </label>
'''
          if '상세 계산정보 포함' not in s:
              if old not in s: raise SystemExit('preview anchor not found')
              s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('app/page.tsx')
          s = p.read_text()
          old = '        <SupportPanel />\n'
          new = '''        <details className="reference-details">
          <summary>
            <span>제작자 보기</span>
            <small>제작자 정보와 후원</small>
          </summary>
          <div className="reference-body">
            <SupportPanel />
          </div>
        </details>
'''
          if '<span>제작자 보기</span>' not in s:
              if old not in s: raise SystemExit('support anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Verify
        run: npm ci && npm run verify
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/components/P2PTradeTool.tsx app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Simplify shared trade details and collapse creator section"
          git push origin HEAD:feature/receive-info-current-main-final
