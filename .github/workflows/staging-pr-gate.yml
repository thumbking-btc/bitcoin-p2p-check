name: Staging PR Gate

on:
  pull_request:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: staging-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact PR revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare the guarded repair candidate
        run: python scripts/repair-review-branch.py

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the verified browser runtime
        run: npx playwright install --with-deps chromium

      - name: Verify the repaired candidate
        run: npm run verify

      - name: Verify the built static asset graph
        run: node scripts/check-static-assets.mjs

      - name: Commit the verified repair and restore the normal gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore market refresh safety contract"
          git push origin HEAD:review/ux-safety-20260903
