name: Maintenance bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-and-verify:
    if: github.head_ref == 'chore/maintenance-verification-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Connect production logic to verified tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          component_path = Path("app/components/P2PTradeTool.tsx")
          component = component_path.read_text(encoding="utf-8")
          component_marker = 'import { getMarketRefreshDelay, getMarketRefreshInterval } from "../lib/market-refresh.mjs";'
          if component_marker not in component:
              component = replace_once(
                  component,
                  'import { readTradeDraft, writeTradeDraft } from "../lib/trade-draft.mjs";\n',
                  'import { readTradeDraft, writeTradeDraft } from "../lib/trade-draft.mjs";\n'
                  'import { getMarketRefreshDelay, getMarketRefreshInterval } from "../lib/market-refresh.mjs";\n',
                  "market refresh import",
              )
              component = replace_once(
                  component,
                  'const MARKET_REFRESH_WITH_LIVE_PRICE_MS = 60_000;\n'
                  'const MARKET_REFRESH_FALLBACK_MS = 16_000;\n',
                  '',
                  "duplicated market refresh constants",
              )
              component = replace_once(
                  component,
                  '  const marketRefreshIntervalMs = livePriceActive\n'
                  '    ? MARKET_REFRESH_WITH_LIVE_PRICE_MS\n'
                  '    : MARKET_REFRESH_FALLBACK_MS;\n',
                  '  const marketRefreshIntervalMs = getMarketRefreshInterval(livePriceActive);\n',
                  "market refresh interval selection",
              )
              component = replace_once(
                  component,
                  '    const getRefreshDelay = () => {\n'
                  '      const lastRequestAt = lastMarketRefreshAtRef.current;\n'
                  '      if (!Number.isFinite(lastRequestAt) || lastRequestAt <= 0) return 0;\n'
                  '      const elapsed = Math.max(0, Date.now() - lastRequestAt);\n'
                  '      return Math.max(0, marketRefreshIntervalMs - elapsed);\n'
                  '    };\n',
                  '    const getRefreshDelay = () => getMarketRefreshDelay(\n'
                  '      lastMarketRefreshAtRef.current,\n'
                  '      marketRefreshIntervalMs,\n'
                  '    );\n',
                  "inline market refresh delay calculation",
              )
              component_path.write_text(component, encoding="utf-8")

          test_path = Path("tests/rendered-html.test.mjs")
          tests = test_path.read_text(encoding="utf-8")
          test_marker = '  getMarketRefreshInterval,\n  MARKET_REFRESH_FALLBACK_MS,'
          if test_marker not in tests:
              tests = replace_once(
                  tests,
                  'import { getMarketRefreshDelay, MARKET_REFRESH_INTERVAL_MS } from "../app/lib/market-refresh.mjs";\n',
                  'import {\n'
                  '  getMarketRefreshDelay,\n'
                  '  getMarketRefreshInterval,\n'
                  '  MARKET_REFRESH_FALLBACK_MS,\n'
                  '  MARKET_REFRESH_WITH_LIVE_PRICE_MS,\n'
                  '} from "../app/lib/market-refresh.mjs";\n',
                  "market refresh test import",
              )
              tests = replace_once(
                  tests,
                  'test("schedules visible market refreshes just beyond the 15-second server cache", () => {\n'
                  '  assert.equal(MARKET_REFRESH_INTERVAL_MS, 16_000);\n'
                  '  assert.equal(getMarketRefreshDelay(0, 100_000), 0);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, 100_000), 16_000);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, 115_999), 1);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, 116_000), 0);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, 120_000), 0);\n'
                  '});\n',
                  'test("uses the tested fallback and live market refresh intervals", () => {\n'
                  '  assert.equal(MARKET_REFRESH_FALLBACK_MS, 16_000);\n'
                  '  assert.equal(MARKET_REFRESH_WITH_LIVE_PRICE_MS, 60_000);\n'
                  '  assert.equal(getMarketRefreshInterval(false), MARKET_REFRESH_FALLBACK_MS);\n'
                  '  assert.equal(getMarketRefreshInterval(true), MARKET_REFRESH_WITH_LIVE_PRICE_MS);\n'
                  '  assert.equal(getMarketRefreshDelay(0, MARKET_REFRESH_FALLBACK_MS, 100_000), 0);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, MARKET_REFRESH_FALLBACK_MS, 100_000), 16_000);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, MARKET_REFRESH_FALLBACK_MS, 115_999), 1);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, MARKET_REFRESH_FALLBACK_MS, 116_000), 0);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, MARKET_REFRESH_WITH_LIVE_PRICE_MS, 159_999), 1);\n'
                  '  assert.equal(getMarketRefreshDelay(100_000, MARKET_REFRESH_WITH_LIVE_PRICE_MS, 160_000), 0);\n'
                  '});\n',
                  "market refresh timing test",
              )
              tests = replace_once(
                  tests,
                  '  assert.match(component, /const marketRefreshIntervalMs = livePriceActive[\\s\\S]*MARKET_REFRESH_WITH_LIVE_PRICE_MS[\\s\\S]*MARKET_REFRESH_FALLBACK_MS/);\n'
                  '  assert.match(component, /const getRefreshDelay = \\(\\) => \\{[\\s\\S]*lastMarketRefreshAtRef\\.current[\\s\\S]*marketRefreshIntervalMs - elapsed/);\n',
                  '  assert.match(component, /const marketRefreshIntervalMs = getMarketRefreshInterval\\(livePriceActive\\)/);\n'
                  '  assert.match(component, /const getRefreshDelay = \\(\\) => getMarketRefreshDelay\\([\\s\\S]*lastMarketRefreshAtRef\\.current,[\\s\\S]*marketRefreshIntervalMs/);\n',
                  "market refresh source assertions",
              )
              tests = replace_once(
                  tests,
                  'async function readPngSize(url) {\n',
                  'async function readAppVersion() {\n'
                  '  const source = await readFile(new URL("../app/lib/app-version.ts", import.meta.url), "utf8");\n'
                  '  const match = source.match(/export const APP_VERSION = "([^"]+)";/);\n'
                  '  assert.ok(match, "APP_VERSION must be a quoted string");\n'
                  '  return match[1];\n'
                  '}\n\n'
                  'async function readPngSize(url) {\n',
                  "app version helper",
              )
              tests = replace_once(
                  tests,
                  '  const [manifestText, serviceWorker, registration, installCta, siteRouteNav, css, appIconSource, maskableSource, shareRenderer, ogImage] = await Promise.all([\n',
                  '  const [manifestText, serviceWorker, registration, installCta, siteRouteNav, css, appIconSource, maskableSource, shareRenderer, ogImage, appVersion] = await Promise.all([\n',
                  "PWA test version result",
              )
              tests = replace_once(
                  tests,
                  '    readFile(new URL("../public/og-v2.png", import.meta.url)),\n'
                  '  ]);\n',
                  '    readFile(new URL("../public/og-v2.png", import.meta.url)),\n'
                  '    readAppVersion(),\n'
                  '  ]);\n',
                  "PWA test version read",
              )
              tests = replace_once(
                  tests,
                  r'  assert.match(html, /aria-label="버전 2\.0\.4">v2\.0\.4<\/span>/);' + '\n',
                  '  assert.ok(html.includes(`aria-label="버전 ${appVersion}">v${appVersion}</span>`));\n',
                  "rendered app version assertion",
              )
              tests = replace_once(
                  tests,
                  '  const [worker, nextConfig, wrangler, headers, css, home, packageJson] = await Promise.all([\n',
                  '  const [worker, nextConfig, wrangler, headers, css, home, packageJson, appVersion] = await Promise.all([\n',
                  "static test version result",
              )
              tests = replace_once(
                  tests,
                  '    readFile(new URL("../package.json", import.meta.url), "utf8"),\n'
                  '  ]);\n',
                  '    readFile(new URL("../package.json", import.meta.url), "utf8"),\n'
                  '    readAppVersion(),\n'
                  '  ]);\n',
                  "static test version read",
              )
              tests = replace_once(
                  tests,
                  r'  assert.match(packageJson, /"version": "2\.0\.4"/);' + '\n',
                  '  assert.equal(JSON.parse(packageJson).version, appVersion);\n',
                  "package version assertion",
              )
              tests = replace_once(
                  tests,
                  '  const iphoneCard = html.match(',
                  '  assert.equal((installSource.match(/loading="lazy"/g) ?? []).length, 2);\n'
                  '  assert.equal((installSource.match(/decoding="async"/g) ?? []).length, 2);\n'
                  '  const iphoneCard = html.match(',
                  "install image loading assertions",
              )
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Regenerate the dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/P2PTradeTool.tsx tests/rendered-html.test.mjs package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Connect maintenance logic to verified tests"
          git push origin HEAD:${{ github.head_ref }}
