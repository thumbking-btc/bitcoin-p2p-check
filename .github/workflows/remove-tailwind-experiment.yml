name: Remove Tailwind experiment

on:
  push:
    branches:
      - experiment/remove-tailwind

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/remove-tailwind
          fetch-depth: 0

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Measure current main-equivalent build
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          npm ci
          install_seconds=$(( $(date +%s) - start ))

          rm -rf dist
          start=$(date +%s)
          npm test
          test_seconds=$(( $(date +%s) - start ))
          npm run lint

          INSTALL_SECONDS="$install_seconds" TEST_SECONDS="$test_seconds" LABEL="main" node <<'NODE' > /tmp/main-metrics.json
          const fs = require("node:fs");
          const path = require("node:path");
          const zlib = require("node:zlib");

          function filesUnder(root) {
            if (!fs.existsSync(root)) return [];
            const output = [];
            const visit = (current) => {
              for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
                const full = path.join(current, entry.name);
                if (entry.isDirectory()) visit(full);
                else if (entry.isFile()) output.push(full);
              }
            };
            visit(root);
            return output;
          }

          function summarize(files) {
            let bytes = 0;
            let gzipBytes = 0;
            for (const file of files) {
              const data = fs.readFileSync(file);
              bytes += data.length;
              gzipBytes += zlib.gzipSync(data, { level: 9 }).length;
            }
            return { files: files.length, bytes, gzipBytes };
          }

          const clientFiles = filesUnder("dist/client");
          const packageFiles = filesUnder("node_modules").filter((file) => path.basename(file) === "package.json");
          const byExtension = (extension) => clientFiles.filter((file) => file.endsWith(extension));

          const result = {
            label: process.env.LABEL,
            installSeconds: Number(process.env.INSTALL_SECONDS),
            testSeconds: Number(process.env.TEST_SECONDS),
            nodeModules: summarize(filesUnder("node_modules")),
            installedPackageCopies: packageFiles.length,
            client: summarize(clientFiles),
            css: summarize(byExtension(".css")),
            js: summarize(byExtension(".js")),
            html: summarize(byExtension(".html")),
            packageLockBytes: fs.statSync("package-lock.json").size,
          };
          process.stdout.write(JSON.stringify(result, null, 2));
          NODE

      - name: Replace Tailwind with vendored Preflight
        shell: bash
        run: |
          set -euo pipefail

          {
            cat <<'HEADER'
          /*
           * Tailwind CSS v4.2.1 Preflight, vendored under the MIT License.
           * Kept locally to preserve the existing browser normalization without
           * requiring Tailwind during development or production builds.
           */
          HEADER
            cat node_modules/tailwindcss/preflight.css
          } > app/preflight.css

          node <<'NODE'
          const fs = require("node:fs");

          const cssPath = "app/globals.css";
          const css = fs.readFileSync(cssPath, "utf8");
          const updatedCss = css.replace(/^@import\s+["']tailwindcss["'];\s*\n/, '@import "./preflight.css";\n');
          if (updatedCss === css) throw new Error("Tailwind import was not found");
          fs.writeFileSync(cssPath, updatedCss);

          const packagePath = "package.json";
          const packageJson = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          delete packageJson.devDependencies["@tailwindcss/postcss"];
          delete packageJson.devDependencies.tailwindcss;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          rm postcss.config.mjs
          npm install --package-lock-only --ignore-scripts

      - name: Measure Tailwind-free build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist

          start=$(date +%s)
          npm ci
          install_seconds=$(( $(date +%s) - start ))

          start=$(date +%s)
          npm test
          test_seconds=$(( $(date +%s) - start ))
          npm run lint

          INSTALL_SECONDS="$install_seconds" TEST_SECONDS="$test_seconds" LABEL="experiment" node <<'NODE' > /tmp/experiment-metrics.json
          const fs = require("node:fs");
          const path = require("node:path");
          const zlib = require("node:zlib");

          function filesUnder(root) {
            if (!fs.existsSync(root)) return [];
            const output = [];
            const visit = (current) => {
              for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
                const full = path.join(current, entry.name);
                if (entry.isDirectory()) visit(full);
                else if (entry.isFile()) output.push(full);
              }
            };
            visit(root);
            return output;
          }

          function summarize(files) {
            let bytes = 0;
            let gzipBytes = 0;
            for (const file of files) {
              const data = fs.readFileSync(file);
              bytes += data.length;
              gzipBytes += zlib.gzipSync(data, { level: 9 }).length;
            }
            return { files: files.length, bytes, gzipBytes };
          }

          const clientFiles = filesUnder("dist/client");
          const packageFiles = filesUnder("node_modules").filter((file) => path.basename(file) === "package.json");
          const byExtension = (extension) => clientFiles.filter((file) => file.endsWith(extension));

          const result = {
            label: process.env.LABEL,
            installSeconds: Number(process.env.INSTALL_SECONDS),
            testSeconds: Number(process.env.TEST_SECONDS),
            nodeModules: summarize(filesUnder("node_modules")),
            installedPackageCopies: packageFiles.length,
            client: summarize(clientFiles),
            css: summarize(byExtension(".css")),
            js: summarize(byExtension(".js")),
            html: summarize(byExtension(".html")),
            packageLockBytes: fs.statSync("package-lock.json").size,
          };
          process.stdout.write(JSON.stringify(result, null, 2));
          NODE

      - name: Write comparison report
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const main = JSON.parse(fs.readFileSync("/tmp/main-metrics.json", "utf8"));
          const experiment = JSON.parse(fs.readFileSync("/tmp/experiment-metrics.json", "utf8"));

          const format = (value) => new Intl.NumberFormat("en-US").format(value);
          const delta = (before, after) => {
            const difference = after - before;
            const percent = before === 0 ? 0 : (difference / before) * 100;
            return `${difference > 0 ? "+" : ""}${format(difference)} (${percent > 0 ? "+" : ""}${percent.toFixed(1)}%)`;
          };
          const row = (name, before, after) => `| ${name} | ${format(before)} | ${format(after)} | ${delta(before, after)} |`;

          const report = `# Tailwind removal experiment\n\n` +
            `Baseline: main commit \`${process.env.GITHUB_SHA}\` before the experiment patch.\n\n` +
            `The experiment keeps Tailwind CSS 4.2.1 Preflight as a local stylesheet, while removing the Tailwind/PostCSS build dependencies. This isolates build-tool overhead without intentionally changing the existing normalization behavior.\n\n` +
            `## Verification\n\n` +
            `- Baseline: \`npm test\` and \`npm run lint\` passed.\n` +
            `- Experiment: \`npm test\` and \`npm run lint\` passed.\n` +
            `- Production \`main\` was not modified.\n\n` +
            `## Measured results\n\n` +
            `| Metric | Main | Experiment | Difference |\n` +
            `|---|---:|---:|---:|\n` +
            row("Installed node_modules bytes", main.nodeModules.bytes, experiment.nodeModules.bytes) + `\n` +
            row("Installed package copies", main.installedPackageCopies, experiment.installedPackageCopies) + `\n` +
            row("Client output bytes", main.client.bytes, experiment.client.bytes) + `\n` +
            row("Client CSS bytes", main.css.bytes, experiment.css.bytes) + `\n` +
            row("Client CSS gzip bytes", main.css.gzipBytes, experiment.css.gzipBytes) + `\n` +
            row("Client JavaScript bytes", main.js.bytes, experiment.js.bytes) + `\n` +
            row("Client JavaScript gzip bytes", main.js.gzipBytes, experiment.js.gzipBytes) + `\n` +
            row("Client HTML bytes", main.html.bytes, experiment.html.bytes) + `\n` +
            row("package-lock.json bytes", main.packageLockBytes, experiment.packageLockBytes) + `\n\n` +
            `## Timing note\n\n` +
            `| Run | npm ci | npm test |\n` +
            `|---|---:|---:|\n` +
            `| Main | ${main.installSeconds}s | ${main.testSeconds}s |\n` +
            `| Experiment | ${experiment.installSeconds}s | ${experiment.testSeconds}s |\n\n` +
            `Timing was measured once on the same GitHub-hosted runner and should be treated as directional, not as a stable benchmark.\n`;

          fs.writeFileSync("TAILWIND_EXPERIMENT.md", report);
          NODE

      - name: Commit experiment result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remove-tailwind-experiment.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Experiment: remove unused Tailwind build pipeline"
          git push origin HEAD:experiment/remove-tailwind
